# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Laboratorio 3 - Integracion de Pruebas Automatizadas al Pipeline
# El pipeline se divide en tres etapas encadenadas mediante "needs", de modo que
# cada una se ejecuta unicamente si la anterior finalizo correctamente:
#
#   1. Compilacion  ->  2. Pruebas y cobertura  ->  3. Empaquetado
#
# Alcance: guardian de main. Valida el PR antes del merge (pull_request) y
# revalida el resultado real del merge (push a main). Las ramas de trabajo
# las cubre maven.yml.

name: Java CI with Maven (Main / Prod)

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "main" ]

jobs:

  # ETAPA 1 -------------------------------------------------------------------
  compilacion:
    name: 1. Compilacion

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      ## Uncomment the following line to run build & tests
      #run: mvn -B package --file pom.xml
      ## Uncomment the following line to run build without tests option 1
      run: mvn -B package --file pom.xml -DskipTests
      ## Uncomment the following line to run build without test option 2
      #run: ./mvnw --batch-mode compile

  # ETAPA 2 -------------------------------------------------------------------
  # Solo se ejecuta si la compilacion fue exitosa (needs: compilacion).
  pruebas:
    name: 2. Pruebas unitarias y cobertura
    needs: compilacion

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run tests with Maven
      #run: ./mvnw --batch-mode test
      run: mvn -B test --file pom.xml

    # QUALITY GATE: jacoco:report genera el reporte de cobertura y jacoco:check
    # valida el umbral minimo definido en el pom (jacoco.line.coverage.minimum).
    # Si la cobertura baja de ese umbral el job falla y la etapa 3 no se ejecuta.
    - name: Run Code Coverage with Maven
      #run: ./mvnw --batch-mode test
      run: mvn -B test jacoco:report jacoco:check --file pom.xml

    # Publicar Reporte de Pruebas
    - name: Publish Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-artifact
        path: target/surefire-reports/

    # Publicar Reporte de Cobertura
    - name: Publish Code Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report-artifact
        path: target/site/jacoco/

  # ETAPA 3 -------------------------------------------------------------------
  # Solo se ejecuta si las pruebas y el Quality Gate fueron superados.
  empaquetado:
    name: 3. Empaquetado
    needs: pruebas

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # Se omiten las pruebas porque ya fueron ejecutadas y validadas en la etapa 2.
    - name: Package with Maven
      run: mvn -B package --file pom.xml -DskipTests

    # Publicar JAR
    - name: Publish JAR
      uses: actions/upload-artifact@v4
      with:
        name: webapi-artifact
        path: target/*.jar

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
